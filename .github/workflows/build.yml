name: Build ProCam APK (Zip Upload)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip ProCam project
      run: unzip ProCam_FIXED.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant Gradle permission
      run: chmod +x ProCam/gradlew

    - name: Build Debug APK
      working-directory: ProCam
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ProCam-APK
        path: ProCam/app/build/outputs/apk/debug/app-debug.apk
